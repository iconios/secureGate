<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f4f6f8;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border-radius: 12px;
        padding: 28px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        color: #111827;
      }

      p {
        margin: 0 0 24px;
        color: #6b7280;
        font-size: 14px;
        line-height: 1.5;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 600;
        color: #374151;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
      }

      input:focus {
        outline: none;
        border-color: #2563eb;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }

      .message {
        display: none;
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.4;
      }

      .message.success {
        display: block;
        background: #dcfce7;
        color: #166534;
      }

      .message.error {
        display: block;
        background: #fee2e2;
        color: #991b1b;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>Reset Password</h1>
      <p>Enter your new password below.</p>

      <div id="resetPasswordForm">
        <label for="password">New Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter new password"
          required
          minlength="8"
        />

        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password"
          required
          minlength="8"
        />

        <button type="button" id="submitBtn">Update Password</button>
      </div>

      <div id="message" class="message"></div>
    </div>

    <script src="/reset-password.js" defer></script>
  </body>
</html>
